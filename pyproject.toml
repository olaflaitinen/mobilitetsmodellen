[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mobilitetsmodellen"
version = "0.1.0"
description = "Machine-learning estimators of intergenerational mobility in Sweden."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "EUPL-1.2" }
authors = [
    { name = "Gustav Olaf Yunus Laitinen-Fredriksson Lundstrom Imanov", email = "olaf.laitinen@su.se" },
]
maintainers = [
    { name = "Gustav Olaf Yunus Laitinen-Fredriksson Lundstrom Imanov", email = "olaf.laitinen@su.se" },
]
keywords = [
    "intergenerational mobility",
    "Sweden",
    "rank-rank",
    "double machine learning",
    "causal forests",
    "empirical Bayes",
    "EUPL-1.2",
    "OSOR",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "linearmodels>=6",
    "econml>=0.15",
    "doubleml>=0.7",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pydantic>=2.6",
    "typer>=0.12",
    "structlog>=24.1",
    "rich>=13",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "pytest-randomly>=3.15",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "nox>=2024.4.15",
    "reuse>=4",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "kaleido>=0.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2",
]
bench = ["pytest-benchmark>=4"]

[project.scripts]
mobilitetsmodellen = "mobilitetsmodellen.cli:main"

[project.urls]
Homepage = "https://github.com/olaflaitinen/mobilitetsmodellen"
Documentation = "https://olaflaitinen.github.io/mobilitetsmodellen"
Repository = "https://github.com/olaflaitinen/mobilitetsmodellen"
Issues = "https://github.com/olaflaitinen/mobilitetsmodellen/issues"
Changelog = "https://github.com/olaflaitinen/mobilitetsmodellen/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mobilitetsmodellen"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "NOTICE",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "S", "A", "COM", "PIE", "RET", "TCH", "ARG", "DTZ"]
ignore = [
    "COM812",
    "S101",
    "PLR0913",
    "PLR2004",
    "SIM108",
    "RET504",
    "TC003",
    "TC001",
    "TC002",
    "PLC0415",
]
per-file-ignores = { "tests/*" = ["S101", "ARG001", "PLR2004", "B017"], "benchmarks/*" = ["ARG001"], "src/mobilitetsmodellen/cli.py" = ["B008"] }

[tool.ruff.lint.isort]
known-first-party = ["mobilitetsmodellen"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
warn_return_any = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "doubleml.*",
    "econml.*",
    "linearmodels.*",
    "geopandas.*",
    "shapely.*",
    "pyarrow.*",
    "statsmodels.*",
    "plotly.*",
    "lightgbm.*",
    "xgboost.*",
    "sklearn.*",
    "scipy.*",
    "cffconvert.*",
    "polars.*",
    "rich.*",
    "structlog.*",
    "matplotlib.*",
    "shap.*",
    "pandas.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["mobilitetsmodellen"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
